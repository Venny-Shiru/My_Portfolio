<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Aspirea career planning dashboard</title>
  <desc id="desc">A warm illustrated dashboard showing a learner career roadmap.</desc>
  <rect width="1200" height="800" fill="#f6efe3"/>
  <circle cx="1030" cy="110" r="180" fill="#f4c95d" opacity=".55"/>
  <circle cx="110" cy="720" r="220" fill="#d96b45" opacity=".18"/>
